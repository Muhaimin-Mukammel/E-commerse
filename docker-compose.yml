version: "5.1.4"

services:
  user-mode:
    build:
      context: ./user-mode
      dockerfile: Dockerfile
    container_name: user-mode
    ports:
      - "8081:8080"

  admin-mode:
    build:
      context: ./admin-mode
      dockerfile: Dockerfile
    container_name: admin-mode
    ports:
      - "8082:8080"

  merchant-mode:
    build:
      context: ./merchant-mode
      dockerfile: Dockerfile
    container_name: merchant-mode
    ports:
      - "8083:8080"

  gateway-eventbus:
    build:
      context: ./gateway-eventbus
      dockerfile: Dockerfile
    container_name: gateway-eventbus
    ports:
      - "8080:8080"

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: keycloak
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak_db
      KC_DB_USERNAME: postgres
      KC_DB_PASSWORD: password
      KC_HOSTNAME: http://gateway-eventbus:8080
      KC_HOSTNAME_STRICT_HTTPS: "false"
    volumes:
      - ./infrastructure/keycloak/ecommerce-realm.json:/opt/keycloak/data/import/ecommerce-realm.json
    expose:
      - "8080"
    depends_on:
      - postgres

  postgres:
    image: postgres:17
    container_name: master-db

    ports:
      - "5433:5432"

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: master_db

    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/postgres/db.sql:/docker-entrypoint-initdb.d/db.sql

  postgres-slave:
    image: postgres:17
    container_name: slave_db

    ports:
      - "5435:5432"

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: slave-db

    volumes:
      - postgres-slave-data:/var/lib/postgresql/data

  redis:
    image: redis:8
    container_name: cache
    ports:
      - "6379:6379"

    volumes:
      - redis-data:/data

volumes: { postgres-data:  , postgres-slave-data:  , redis-data: }
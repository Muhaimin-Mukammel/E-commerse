name: Zestora

x-java-service: &java-service
  restart: "no"
  networks:
    [zestora-net]

services:

  user-mode:
    <<: *java-service
    build:
      context: ./user-mode
      dockerfile: Dockerfile
    container_name: user-mode
    expose: [8080]
    environment:
      DB_URL : jdbc:postgresql://postgres:5432/user_mode_db
      DB_USERNAME : usermode
      DB_PASSWORD : ${USER_DB_PASSWORD:?}
    depends_on:
      postgres:
        condition: service_healthy

  admin-mode:
    <<: *java-service
    build:
      context: ./admin-mode
      dockerfile: Dockerfile
    container_name: admin-mode
    expose: [8080]
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/admin_mode_db
      DB_USERNAME: adminmode
      DB_PASSWORD: ${ADMIN_DB_PASSWORD:?}
    depends_on:
      postgres:
        condition: service_healthy

  merchant-mode:
    <<: *java-service
    build:
      context: ./merchant-mode
      dockerfile: Dockerfile
    container_name: merchant-mode
    expose: [8080]
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/merchant_mode_db
      DB_USERNAME: merchantmode
      DB_PASSWORD: ${MERCHANT_DB_PASSWORD:?}
    depends_on:
      postgres:
        condition: service_healthy

  gateway-eventbus:
    <<: *java-service
    build:
      context: ./gateway-eventbus
      dockerfile: Dockerfile
    container_name: gateway-eventbus
    ports:
      - "8080:8080"
    environment:
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:?}
    depends_on:
      redis:
        condition: service_healthy
      auth-service:
        condition: service_started
      user-mode:
        condition: service_started
      merchant-mode:
        condition: service_started

  postgres:
    image: postgres:17
    container_name: master-db
    restart: unless-stopped
    ports: [ "127.0.0.1:5433:5432" ]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: master_db
      USER_DB_PASSWORD: ${USER_DB_PASSWORD:?}
      MERCHANT_DB_PASSWORD: ${MERCHANT_DB_PASSWORD:?}
      ADMIN_DB_PASSWORD: ${ADMIN_DB_PASSWORD:?}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:?}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/postgres/01-init.sh:/docker-entrypoint-initdb.d/01-init.sh:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d master_db" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - zestora-net

  redis:
    image: redis:8
    container_name: cache
    restart: unless-stopped
    command: [ "sh", "-c", "exec redis-server /usr/local/etc/redis/redis.conf --requirepass \"$$REDIS_PASSWORD\"" ]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?}
    ports: [ "127.0.0.1:6379:6379" ]
    volumes:
      - ./infrastructure/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - redis-data:/data
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG" ]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
     - zestora-net

  auth-service:
    <<: *java-service
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: auth-service
    expose: [8080]
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/auth_db
      DB_USERNAME: auth
      DB_PASSWORD: ${AUTH_DB_PASSWORD:?}
      JWT_SECRET: ${JWT_SECRET:?}
      JWT_ACCESS_EXPIRATION: 900000
      JWT_REFRESH_EXPIRATION: 604800000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes: { postgres-data:  , redis-data: }
networks:
  zestora-net:
    driver: bridge

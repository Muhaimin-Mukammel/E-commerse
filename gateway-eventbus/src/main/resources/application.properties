server.port=8080
spring.application.name=gateway-eventbus

spring.cloud.gateway.routes[0].id=user-mode
spring.cloud.gateway.routes[0].uri=http://localhost:8081
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/user/**
spring.cloud.gateway.routes[0].filters[0]=RateLimiting

spring.cloud.gateway.routes[1].id=merchant-mode
spring.cloud.gateway.routes[1].uri=http://localhost:8082
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/merchant/**
spring.cloud.gateway.routes[1].filters[0]=RateLimiting

spring.cloud.gateway.routes[2].id=admin-mode
spring.cloud.gateway.routes[2].uri=http://localhost:8083
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/admin/**
spring.cloud.gateway.routes[2].filters[0]=RateLimiting
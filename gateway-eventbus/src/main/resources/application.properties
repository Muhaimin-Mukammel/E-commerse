server.port=8080
spring.application.name=gateway-eventbus
spring.main.web-application-type=reactive

management.endpoints.web.exposure.include=gateway,health,info
management.endpoint.gateway.enabled=true

spring.cloud.gateway.server.webflux.routes[0].id=user-mode
spring.cloud.gateway.server.webflux.routes[0].uri=http://user-mode:8080
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/v1/user/**
spring.cloud.gateway.routes[0].filters[0]=RateLimiting

spring.cloud.gateway.server.webflux.routes[1].id=merchant-mode
spring.cloud.gateway.server.webflux.routes[1].uri=http://merchant-mode:8080
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/v1/merchant/**
spring.cloud.gateway.server.webflux.routes[1].filters[0]=RateLimiting

spring.cloud.gateway.server.webflux.routes[2].id=admin-mode
spring.cloud.gateway.server.webflux.routes[2].uri=http://admin-mode:8080
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/v1/admin/**
spring.cloud.gateway.server.webflux.routes[2].filters[0]=RateLimiting

spring.cloud.gateway.server.webflux.routes[3].id=keycloak-auth
spring.cloud.gateway.server.webflux.routes[3].uri=http://keycloak:8080
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/realms/**
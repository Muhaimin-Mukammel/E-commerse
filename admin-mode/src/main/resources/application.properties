spring.application.name=admin-mode

#Local Database
spring.datasource.local.url=jdbc:postgresql://postgres:5432/admin_mode_db
spring.datasource.local.username=adminlocal
spring.datasource.local.password=adminlocal1234
spring.datasource.local.driver-class-name=org.postgresql.Driver

#Shared Database
spring.datasource.shared.url=jdbc:postgresql://postgres:5432/shared_db
spring.datasource.shared.username=shared
spring.datasource.shared.password=shared1234
spring.datasource.shared.driver-class-name=org.postgresql.Driver

#KeyCloak Database
spring.datasource.keycloak.url=jdbc:postgresql://postgres:5432/keycloak_db
spring.datasource.keycloak.username=keycloak
spring.datasource.keycloak.password=keycloak1234
spring.datasource.keycloak.driver-class-name=org.postgresql.Driver

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://keycloak:8080/realms/ecommerce